<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biodata</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            /* Latar belakang warna gradasi */
            background: linear-gradient(135deg, #1e1b4b, #312e81, #4338ca);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* Kartu dengan ukuran jauh lebih besar & luas */
        .card {
            background-color: #ffffff;
            padding: 60px 80px;
            border-radius: 24px;
            /* Border lebih tebal */
            border: 4px solid #6366f1;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
            text-align: center;
            /* Lebar maksimal diperbesar menjadi 800px */
            max-width: 800px;
            width: 95%;
        }

        .card h1 {
            color: #1e1b4b;
            font-size: 42px;
            margin-bottom: 40px;
            border-bottom: 5px solid #6366f1;
            display: inline-block;
            padding-bottom: 10px;
            letter-spacing: 2px;
        }

        .info-group {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .info-box {
            background-color: #f8fafc;
            border: 2px dashed #cbd5e1;
            padding: 20px;
            border-radius: 12px;
        }

        .info-box p {
            color: #334155;
            font-size: 26px;
            font-weight: 700;
        }

        .info-box span {
            color: #4f46e5;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>BIODATA</h1>
        <div class="info-group">
            <div class="info-box">
                <p>Nama : <span>Zaidan Ataya Rizqulah</span></p>
            </div>
            <div class="info-box">
                <p>Kelas : <span>XI TKJ 4</span></p>
            </div>
            <div class="info-box">
                <p>Absen : <span>34</span></p>
            </div>
        </div>
    </div>

</body>
</html>
